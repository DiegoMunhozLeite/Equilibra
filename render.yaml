services:
  - type: web
    name: equilibra
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        fromDatabase:
          name: equilibra-db
          property: connectionString
      - key: MODO_AVALIACAO
        value: "1"
      - key: CODIGO_CADASTRO
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
databases:
  - name: equilibra-db
    plan: basic-256mb
